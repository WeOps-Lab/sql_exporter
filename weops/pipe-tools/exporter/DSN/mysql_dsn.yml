apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-dsn
  namespace: sql-exporter
data:
  SQL_EXPORTER_DB_TYPE: mysql
  SQL_EXPORTER_HOST: mysql-standalone-v5-7.mysql
  SQL_EXPORTER_PASS: Weops!
  SQL_EXPORTER_PORT: "3306"
  SQL_EXPORTER_TIMEOUT: "5"
  SQL_EXPORTER_USER: weops
  COLLECTOR_REFS: mysql*
  SCRAPE_TIMEOUT_OFFSET: 500ms
  MIN_INTERVAL: 1s
  MAX_CONNECTIONS: "3"
  MAX_IDLE_CONNECTIONS: "3"
  MAX_CONNECTION_LIFETIME: 3m
  SCRAPE_TIMEOUT: 20s
